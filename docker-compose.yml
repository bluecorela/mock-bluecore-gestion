services:
  api:
    build: .
    image: bluecore-gestion-api:local
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${CONTAINER_PORT:-3000}
    ports:
      - "${API_PORT:-3000}:${CONTAINER_PORT:-3000}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
